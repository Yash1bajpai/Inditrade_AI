services:
  - type: web
    name: inditrade-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: COMTRADE_API_KEY
        sync: false
    healthCheckPath: /health
