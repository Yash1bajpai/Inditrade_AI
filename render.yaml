services:
  - type: web
    name: inditrade-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: COMTRADE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Render terminates TLS in front of the app; without this the in-memory
      # rate limiter buckets every visitor under the proxy IP.
      - key: TRUST_PROXY
        value: "true"
    healthCheckPath: /health
