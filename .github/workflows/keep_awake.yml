name: Keep Render Backend Awake

# Render free-tier services sleep after ~15 minutes without traffic, so the
# first visitor after an idle period waits ~50s for a cold start. This cron
# pings /health every 10 minutes so the backend stays warm — the UptimeRobot
# hack from the original project plan, but with zero external signups.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            "https://inditrade-backend.onrender.com/health" || echo "000")
          echo "health endpoint returned: $CODE"
          # 200 = warm, anything else (or network failure) = surfaced in logs.
          # Not a hard failure: a single missed ping just means the next one
          # (10 min later) re-warms the service.
          if [ "$CODE" != "200" ]; then
            echo "::warning::backend health check returned $CODE"
          fi
