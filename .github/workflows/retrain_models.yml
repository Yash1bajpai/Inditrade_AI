name: Retrain ML Models

on:
  schedule:
    # Run at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub UI

# Required for the release upload step (gh release upload).
permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # requirements-backend.txt carries the model stack:
          # pandas, numpy, scikit-learn, xgboost, joblib, pyarrow.
          pip install -r requirements-backend.txt
          # Training-only deps (kept out of the API image):
          # xgboost_train.py needs optuna + onnxmltools/onnxconverter-common;
          # network_embed.py needs networkx/node2vec.
          pip install "optuna>=3.0" "onnxmltools>=1.12" "onnxconverter-common>=1.14" \
            "networkx>=3.1" "node2vec>=0.4.6"

      - name: Fetch Training Data
        run: |
          set -eu
          # trade_features.parquet is gitignored, so fetch the canonical
          # data release produced by the ingestion pipeline. Without this
          # step every training script dies with FileNotFoundError.
          curl -fL --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/data-v1/inditrade-data.zip" \
            -o /tmp/inditrade-data.zip
          unzip -oq /tmp/inditrade-data.zip -d /tmp/inditrade-data
          mkdir -p data/processed models
          find /tmp/inditrade-data -name '*.parquet' -exec mv {} data/processed/ \;
          find /tmp/inditrade-data -name '*.jsonl' -exec mv {} data/processed/ \;
          test -f data/processed/trade_features.parquet

      - name: Retrain XGBoost Forecast Model
        run: |
          echo "Retraining XGBoost model..."
          # argparse expects kebab-case: --output-dir (not --output_dir)
          python src/models/xgboost_train.py --output-dir models

      - name: Retrain Anomaly Detection Model
        run: |
          echo "Retraining Isolation Forest model..."
          python src/models/anomaly_train.py --output-dir models

      - name: Retrain Network Embedding Model
        run: |
          echo "Retraining Node2Vec embeddings..."
          # Parquet artifacts belong in data/processed; only the .pkl model
          # goes to models/. (--output-dir is the parquet directory.)
          python src/models/network_embed.py --output-dir data/processed --model-dir models

      - name: Publish Retrained Artifacts to Data Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .pkl/.parquet artifacts are gitignored by design (repo stays lean);
          # the Dockerfile pulls inditrade-data.zip from the data-v1 release,
          # so retraining must rebuild and republish that zip — a plain
          # `git add models/` would be a no-op.
          set -eu
          STAGE=/tmp/release-stage
          mkdir -p "$STAGE"
          for f in \
            data/processed/trade_features.parquet \
            data/processed/dgft_policy_chunks.jsonl \
            data/processed/pib_press_releases.jsonl \
            models/xgboost_trade_forecast.pkl \
            models/xgboost_trade_forecast.onnx \
            models/xgboost_trade_forecast_meta.json \
            models/isolation_forest_anomalies.pkl \
            models/node2vec_trade_graph.pkl \
            data/processed/node2vec_trade_embeddings.parquet; do
            if [[ -f "$f" ]]; then
              cp "$f" "$STAGE/"
            else
              echo "WARN: expected artifact missing: $f"
            fi
          done
          if [[ -z $(ls -A "$STAGE") ]]; then
            echo "FATAL: retraining produced no artifacts" >&2
            exit 1
          fi
          (cd "$STAGE" && zip -q -j inditrade-data.zip *)
          ls -la "$STAGE"
          gh release upload data-v1 "$STAGE/inditrade-data.zip" --clobber

      - name: Commit Updated Tracked Metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Only tracked metadata (meta json / flagged csv) — weights live in
          # the release, not git.
          if [[ -n $(git status -s models/ data/) ]]; then
            echo "Tracked metadata changed. Committing..."
            git add -u models/ data/
            git commit -m "Automated model retraining metadata [skip ci]" || echo "nothing to commit"
            git push
          else
            echo "No tracked changes detected."
          fi
