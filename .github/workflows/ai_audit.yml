name: OpenCode AI Audit

# Standing external audit. Fires after every successful Tests run on main
# (i.e. after each push = each finished work session) and on demand.
#
# One persistent OpenCode session is created on the first run and reused for
# every later run: the opencode data dir (~/.local/share/opencode, containing
# the session db) is kept in a rolling actions/cache keyed by run id with a
# stable restore prefix, and the active session id is tracked in a marker
# file inside that same cached path.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "full = re-audit whole repo, incremental = focus on recent commits"
        default: "incremental"
        type: choice
        options: [incremental, full]

concurrency:
  group: opencode-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      AUDIT_MODEL: agentrouter/glm-5.3
      AUDIT_VARIANT: high
      SESSION_TITLE: "IndiTrade AI Audit"
      OC_DATA: /home/runner/.local/share/opencode
      AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine audit scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.scope }}" >> "$GITHUB_OUTPUT"
          else
            echo "scope=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore persistent audit session
        uses: actions/cache@v4
        with:
          path: ~/.local/share/opencode
          key: opencode-audit-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: opencode-audit-

      - name: Install opencode CLI (pinned to the locally-verified version)
        run: |
          npm install -g opencode-ai@1.18.29
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      # The developer's laptop reaches agentrouter through a local proxy on
      # 127.0.0.1:8089; CI goes straight to the hosted upstream. The key is
      # injected from the AGENTROUTER_API_KEY secret via {env:} substitution,
      # so no secret ever lands in the repo.
      # agentrouter.org rejects any client whose User-Agent is not "cline/2.0.0"
      # ("unauthorized client detected"), so opencode cannot reach it directly.
      # The developer's laptop solves this with a local sanitizing proxy — run
      # the same stdlib-only proxy inside the runner and point opencode at it.
      - name: Start agentrouter proxy (client-fingerprint adapter)
        run: |
          nohup python ci/agentrouter_proxy.py > /tmp/proxy.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8089/v1/models; then
              echo "proxy is up"; break
            fi
            sleep 1
          done
          curl -s http://127.0.0.1:8089/v1/models -H "Authorization: Bearer $AGENTROUTER_API_KEY" | head -c 200; echo

      - name: Configure agentrouter provider (via local proxy)
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "agentrouter": {
                "name": "AgentRouter",
                "options": {
                  "baseURL": "http://127.0.0.1:8089/v1",
                  "apiKey": "{env:AGENTROUTER_API_KEY}"
                },
                "models": {
                  "glm-5.3": { "name": "GLM 5.3" }
                }
              }
            }
          }
          EOF

      - name: Run audit (reuse or create the single session)
        run: |
          set -uo pipefail
          MARKER="$OC_DATA/.audit_session_id"
          SID=""
          if [ -f "$MARKER" ]; then
            SID=$(cat "$MARKER" 2>/dev/null || true)
          fi

          # Validate the cached session still exists in opencode's db
          if [ -n "$SID" ]; then
            FOUND=$(sqlite3 "$OC_DATA/opencode.db" \
              "SELECT COUNT(*) FROM session WHERE id='$SID';" 2>/dev/null || echo 0)
            if [ "$FOUND" != "1" ]; then
              echo "::warning::cached session $SID no longer exists; creating a new one"
              SID=""
            fi
          fi

          # The bootstrap must be small: high-reasoning full-repo audits
          # exceeded a 60-minute job timeout twice. Give it a bounded scope,
          # an explicit tool budget, and a word cap.
          FULL_PROMPT='You are the standing external auditor of the IndiTrade AI repository (Indian trade intelligence platform: FastAPI backend, Next.js frontend, ML models, hybrid BM25+vector RAG). This run BOOTSTRAPS your persistent session — keep it small and fast; you must finish within about 15 minutes. Budget: at most 12 tool calls. Do exactly this: (1) run git log --oneline -20; (2) read README.md and PROJECT_MEMORY.md; (3) run git status and check no secrets/keys are tracked (git ls-files | grep -iE "env|secret|key" is enough); (4) skim src/backend/main.py and src/rag/sparse_index.py. Do NOT read anything else. Read-only: never modify files. Then write a markdown report under 500 words: ## Summary (what the repo is, current state), ## Findings (each tagged [CRITICAL]/[HIGH]/[MEDIUM]/[LOW] with file paths), ## Recommendations (max 5). Remember what you learn; later runs will only ask you to audit new commits.'

          INCREMENTAL_PROMPT='You are the same standing auditor of the IndiTrade AI repository, continuing your session. Keep it fast: under 10 minutes, at most 10 tool calls. Run git log --oneline -15, inspect only the recent changes (git show --stat and targeted file reads; read-only, never modify). Audit what changed plus possible regressions. Finish with a markdown report under 400 words: ## Summary, ## Findings (each tagged [CRITICAL]/[HIGH]/[MEDIUM]/[LOW] with file paths), ## Recommendations. If nothing needs attention, say so explicitly.'

          if [ -n "$SID" ] && [ "${{ steps.scope.outputs.scope }}" != "full" ]; then
            echo "Reusing audit session: $SID"
            # Incremental audits run at the model's default reasoning effort:
            # high variant burns 60+ minutes per run on this upstream.
            opencode run -s "$SID" \
              --agent plan -m "$AUDIT_MODEL" --auto --print-logs \
              "$INCREMENTAL_PROMPT" | tee audit_report.md
          else
            echo "No usable session — running full audit and creating the persistent session"
            opencode run \
              --title "$SESSION_TITLE" --agent plan \
              --variant "$AUDIT_VARIANT" -m "$AUDIT_MODEL" --auto --print-logs \
              "$FULL_PROMPT" | tee audit_report.md
            SID=$(sqlite3 "$OC_DATA/opencode.db" \
              "SELECT id FROM session WHERE title='$SESSION_TITLE' ORDER BY time_updated DESC LIMIT 1;")
            mkdir -p "$OC_DATA"
            echo "$SID" > "$MARKER"
            echo "Created persistent audit session: $SID"
          fi

      - name: Dump opencode server logs on failure
        if: failure()
        run: tail -40 "$OC_DATA"/log/*.log 2>/dev/null || echo "(no server logs found)"

      - name: Publish report to job summary
        if: always()
        run: |
          echo "<h2>🤖 OpenCode AI Audit — ${{ github.sha }}</h2>" >> "$GITHUB_STEP_SUMMARY"
          cat audit_report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no report produced)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-audit-report
          path: audit_report.md
          if-no-files-found: warn
