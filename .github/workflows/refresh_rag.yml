name: Refresh policy corpus and RAG
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Scrape live DGFT and PIB before rebuilding (false uses reviewed release corpus)
        type: boolean
        default: true
      seed_asset:
        description: Optional reviewed refresh archive in the data-v1 release
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: policy-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU indexing and scraper dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr poppler-utils
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers 'qdrant-client==1.18.0' rank_bm25 joblib pandas requests beautifulsoup4 lxml pdfplumber tqdm playwright
          playwright install --with-deps chromium
      - name: Restore historical policy corpus
        run: |
          mkdir -p data/processed
          for filename in dgft_policy_chunks.jsonl dgft_ocr_chunks.jsonl pib_press_releases.jsonl policy_qa_dataset.jsonl; do
            gh release download data-v1 --pattern "$filename" --dir data/processed
          done
      - name: Restore reviewed refresh (when supplied)
        if: ${{ inputs.seed_asset != '' }}
        env:
          SEED_ASSET: ${{ inputs.seed_asset }}
        run: |
          gh release download data-v1 --pattern "$SEED_ASSET" --dir /tmp
          python - "$SEED_ASSET" <<'PYCODE'
          import sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path('/tmp') / sys.argv[1]) as archive:
              for name in archive.namelist():
                  if not name.startswith(('data/raw/forex_macro/', 'data/processed/', 'data/cache/')) or '..' in Path(name).parts:
                      raise RuntimeError('Unexpected refresh archive path')
              archive.extractall('.')
          PYCODE
      - name: Scrape real sources (fail closed)
        if: ${{ github.event_name == 'schedule' || inputs.refresh_sources }}
        run: |
          python src/data_ingestion/dgft_pdf_processor.py
          python src/data_ingestion/pib_scraper.py
      - name: Rebuild dense and sparse indexes on CPU
        run: python src/rag/indexer.py
      - name: Evaluate retrieval
        run: python -m src.rag.evaluate_retrieval --mode hybrid --max-questions 100 --output reports/rag_eval_refresh.json
      - name: Archive dense index and publish corpus
        run: |
          tar -czf /tmp/rag-dense-index.tar.gz -C data/cache qdrant_index
          gh release upload data-v1 /tmp/rag-dense-index.tar.gz data/processed/*jsonl --clobber
          if compgen -G 'data/raw/forex_macro/*.csv' > /dev/null; then
            gh release upload data-v1 data/raw/forex_macro/*.csv --clobber
            gh release delete-asset data-v1 cnyinr.csv --yes || true
          fi
      - name: Refresh deployment archive without changing model weights
        run: |
          gh release download data-v1 --pattern inditrade-data.zip --dir /tmp
          mkdir -p /tmp/deploy-stage
          unzip -q /tmp/inditrade-data.zip -d /tmp/deploy-stage
          cp data/processed/*jsonl /tmp/deploy-stage/
          (cd /tmp/deploy-stage && zip -q -j /tmp/inditrade-data-refreshed.zip *)
          cp /tmp/inditrade-data-refreshed.zip /tmp/inditrade-data.zip
          gh release upload data-v1 /tmp/inditrade-data.zip --clobber
      - name: Commit production sparse index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/cache/bm25_index.pkl.lzma data/cache/rag_index_meta.json
          git diff --cached --quiet || { git commit -m 'Refresh verified policy RAG indexes'; git push; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-refresh-evidence
          path: |
            data/cache/rag_index_meta.json
            reports/rag_eval_refresh.json
