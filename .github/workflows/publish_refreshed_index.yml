name: Publish verified refreshed sparse index
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: policy-refresh
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy rank_bm25
      - name: Restore already verified index, no embedding recompute
        run: |
          gh release download data-v1 --pattern 1-verified-refresh-20260930.zip --dir /tmp
          python - <<'PY'
          import zipfile,pickle,lzma,json
          from pathlib import Path
          with zipfile.ZipFile('/tmp/1-verified-refresh-20260930.zip') as z:
              for name in ('data/cache/bm25_index.pkl.lzma','data/cache/rag_index_meta.json'):
                  Path(name).write_bytes(z.read(name))
          with lzma.open('data/cache/bm25_index.pkl.lzma','rb') as f: index=pickle.load(f)
          assert len(index['docs']) == 5195
          assert any(d.get('notification_no')=='40/2026-27' and d.get('date')=='30/09/2026' for d in index['docs'])
          p=Path('data/cache/rag_index_meta.json');meta=json.loads(p.read_text())
          meta['dense_index']['refresh_status']='rebuilt and released by Actions 36715996899; cloud synchronization unverified'
          p.write_text(json.dumps(meta,indent=2))
          PY
      - name: Publish production sparse index and trigger deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/cache/bm25_index.pkl.lzma data/cache/rag_index_meta.json
          git diff --cached --quiet || { git commit -m 'Publish verified September 30 policy corpus for live retrieval'; git pull --rebase origin main; git push; }
